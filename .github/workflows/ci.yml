name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write     # required for OIDC / Workload Identity Federation
  security-events: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  AR_REPO: techmart-images
# NOTE on aquasecurity/trivy-action@0.35.0 used below: this is the first tag
# confirmed safe after the March 2026 supply-chain compromise of tags
# 0.0.1-0.34.2 (credential-stealing malware, CVE-2026-33634). `uses:` doesn't
# support the env context, so the version is repeated at each call site --
# for a real deployment, pin it to a full commit SHA instead of a tag (tags
# can still be force-moved) and keep all three references in sync.

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install deps
        run: |
          pip install -r app/backend/requirements.txt
          pip install -r app/frontend/requirements.txt
          pip install flake8
      - name: Lint
        run: flake8 app/backend app/frontend --max-line-length=120

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v4

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Dependency vulnerability scan
        run: |
          pip install pip-audit
          pip-audit -r app/backend/requirements.txt
          pip-audit -r app/frontend/requirements.txt

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # v2 stopped working once GitHub removed Node 20 runners (Sept 16, 2026) --
      # v3 is required now, not just recommended.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  iac-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # tfsec is unmaintained -- Aqua merged its check library into Trivy and
      # redirected development there. This runs the same rule set via
      # `trivy config` instead of the retired tfsec-action.
      - name: IaC scan (Trivy config)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: HIGH,CRITICAL
          exit-code: "1"

  build-scan-push:
    needs: [lint-test, sast, sca, secrets-scan, iac-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Keyless auth via Workload Identity Federation -- no JSON key ever used
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build backend image
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/backend:${{ github.sha }} app/backend

      - name: Build frontend image
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/frontend:${{ github.sha }} app/frontend

      - name: Scan backend image (Trivy)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Scan frontend image (Trivy)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Push images
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/backend:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/frontend:${{ github.sha }}
