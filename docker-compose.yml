services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: techmart
      POSTGRES_USER: techmart
      POSTGRES_PASSWORD: changeme
    volumes:
      - ./app/backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  backend:
    build: ./app/backend
    environment:
      DB_HOST: db
      DB_NAME: techmart
      DB_USER: techmart
      DB_PASS: changeme
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    build: ./app/frontend
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "8080:8080"
