apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: techmart-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - techmart.example.com
      secretName: techmart-tls
  rules:
    - host: techmart.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
