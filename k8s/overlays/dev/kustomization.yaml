apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: techmart-dev
resources:
  - ../../base
images:
  - name: REGION-docker.pkg.dev/PROJECT_ID/techmart-images/backend
    newTag: latest
  - name: REGION-docker.pkg.dev/PROJECT_ID/techmart-images/frontend
    newTag: latest
replicas:
  - name: backend
    count: 1
  - name: frontend
    count: 1
